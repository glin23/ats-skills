# ============================================================================
# PROJECT_CONTEXT.yaml — 项目情况登记表（3 分钟看懂这张表）
#
# 这张表是什么？
#   装上 Arnold 插件 = 请来一支帮你干活的 AI 开发小队。这张表就是你
#   把项目基本情况告诉它们的「入职登记表」：项目叫什么、重要文件放哪。
#
# 只需要记住一个承诺：
#   ★ 整张表里只有第 ① 区的「项目名」值得现在就填，其余全部可以留空。
#   ★ 留空的格子 = 对应的自动提醒功能安静关闭——不报错、不打扰，
#     其他一切照常。哪天想用哪条提醒，再回来填哪格。
#
# 怎么填？
#   1. 把本文件复制到你项目的根目录（或根目录下的 .claude/ 文件夹），
#      去掉文件名末尾的 .template，变成 PROJECT_CONTEXT.yaml
#   2. 用任何文本编辑器打开，把答案写在冒号后面（冒号后留一个空格），
#      例如：  name: myshop
#   3. 保存即可。以 # 开头的行都是给你看的说明，程序不读。
#
# 一条可以不看的技术备注：
#   有一种「一行式花括号写法」（全表只有一格用到，那里会单独标注）
#   需要电脑装有 PyYAML（一个免费的文件解析零件）才生效；没装不报错，
#   只是那一格当作没填。其余所有格子不需要装任何东西。
# ============================================================================

# ────────────────────────────────────────────────────────────
# ① 先填这区：项目的名字（整张表唯一建议现在就填的）
# ────────────────────────────────────────────────────────────
# （project = 项目基本信息区）
project:
  # 你的项目叫什么名字？（name = 项目名）
  # 为什么要告诉它：AI 小队汇报进展、记工作档案、核对进度看板时，
  # 都用这个名字称呼你的项目（比如看板任务标签「myshop/一期/任务3」）。
  # 不填会怎样：进度看板同步提醒（见下面 roadmap 格）用不起来，其他照常。
  # 怎么填（示例）：name: myshop
  name: "Mr. Weirdo Jobs"

  # 任务档案上的「负责人名」用什么前缀核对？（agent_prefix = 档案负责人名前缀；可跳过）
  # 说明真实用途：AI 小队成员的名字是固定的 arnold-*（arnold-pm、arnold-builder
  # 等），**不会因为这格改名**。这格只影响两件事：① 任务档案 Owner（负责人）格
  # 按「<前缀>-lead」核对；② 派工检查把「<前缀>-*」也当成小队成员一并把关。
  # 不填会怎样：档案上的负责人名字不做核对（档案本身照常记录），其他照常。
  # 怎么填（示例）：agent_prefix: myshop（档案负责人核对名就成了 myshop-lead）
  agent_prefix: arnold

  # 用一句话说，你的产品是干什么的？（product_one_liner = 产品一句话；可跳过）
  # 为什么要告诉它：AI 成员开工前看一眼快速进入状况——像新同事入职
  # 第一天先听一句「我们是做 XX 的」。目前只做参考，不驱动任何检查。
  # 怎么填（示例）：product_one_liner: "帮小店主记账对账的工具"
  product_one_liner: "帮助在美国的大学生找工作的 AI 求职技能包（简历分析 → 找岗 → 批量投递 → 报告 → 跟进）"

# ────────────────────────────────────────────────────────────
# ② 常用区：你项目里几份重要文件放在哪（都可留空，想用再填）
# ────────────────────────────────────────────────────────────
# （paths = 文件位置区）
paths:
  # 你的进度看板（路线图）文件放在哪？（roadmap = 路线图路径）
  # 路线图就是工程进度看板——列着「哪些活干完了、哪些还排着队」。
  # 为什么要告诉它：AI 干完一件影响排期的活去存档时，会先问你一句
  # 「看板要不要顺手更新」，免得看板写着「待办」、实际早就做完了。
  # 不填会怎样：这条提醒安静关闭，其他照常。
  # 怎么填（示例，从项目根目录数起的文件位置）：roadmap: docs/ROADMAP.md
  roadmap: docs/ROADMAP.md

  # （进阶，可跳过）想临时跳过上面那条看板提醒时，用什么「暗号」？
  # （roadmap_skip_env = 跳过提醒的开关名）
  # 有时你明知道这次改动不用更新看板，可以在存档命令前加一句
  # 「<暗号>=1」让它这一次别问。这格是给暗号起名字。
  # 不填会怎样：用默认暗号 ARNOLD_ROADMAP_SKIP，够用了。
  # 怎么填（示例）：roadmap_skip_env: MYSHOP_ROADMAP_SKIP
  roadmap_skip_env:

  # 你项目的「结论说明书」放在哪个文件夹？（living_doc_business = 业务结论文档目录）
  # 结论说明书（living doc，活文档）= 只记「当前最终结论」的文档，
  # 好比户口本——搬过几次家不重要，本上永远只写现住址。
  # 为什么要告诉它：一个方案被 AI 反复讨论修改好几轮后，它会提醒你
  # 「该把最终结论沉淀成说明书了」，免得结论散落在讨论记录里找不回。
  # 不填会怎样：这条提醒安静关闭。
  # 怎么填（示例，文件夹位置）：living_doc_business: docs/SPECS
  living_doc_business: docs/specs

  # （进阶，可跳过）如果「开发流程本身」的结论说明书想单独放一个
  # 文件夹（跟上面产品业务的分开），填在这。多数项目用不上。
  # （living_doc_meta = 开发系统自身的结论文档目录）
  # 怎么填（示例）：living_doc_meta: team/docs/specs
  living_doc_meta:

  # 你的变更日志文件放在哪？（changelog = 变更日志路径）
  # 变更日志 = 项目「大事记」，一行一条记「哪天改了什么、为什么改」。
  # 为什么要告诉它：AI 改了核心代码却半小时没记大事记，会被提醒补一笔
  # ——像出纳花了钱要及时记账，拖久了就想不起来。只提醒，不拦人。
  # 不填会怎样：这条提醒安静关闭。
  # 怎么填（示例）：changelog: docs/CHANGELOG.md
  changelog: CHANGELOG.md

  # 你的术语表放在哪？（glossary = 术语表路径；可跳过）
  # 术语表 = 公司内部的「词典」，规定「客户」不能叫「用户」这类叫法。
  # 这格目前只做参考、不驱动检查；真正的用词把关在下面第 ③ 区填。
  # 怎么填（示例）：glossary: docs/GLOSSARY.md
  glossary:
  # 你的项目记忆文件放在哪？（project_memory = 项目记忆路径；可跳过）
  # 项目记忆 = 记长期原则和关键决定的小本本。填了之后：项目总监长会话每
  # 10 轮会重读它刷新长期原则（防对话太长把老原则忘了），做大事前也先翻它。
  # 不填会怎样：这个定期重读动作没了着落，其他照常。
  # 怎么填（示例）：project_memory: PROJECT_MEMORY.md
  project_memory: PROJECT_MEMORY.md

# ────────────────────────────────────────────────────────────
# ③ 用词把关区：让 AI 写东西不用错词（整区可留空 = 不把关）
# ────────────────────────────────────────────────────────────
# 这一区（terminology = 用词规范区）相当于把公司「词典」里最要紧的
# 几条规矩教给自动把关员：AI 往文件里写内容用错了词会被当场拦下，
# 主对话里说错了词会被提醒。
terminology:
  # 有哪些「过时的旧叫法」要禁止、必须换成新叫法？
  # （deprecated_aliases = 弃用旧词对照表）
  # 比喻：公司拍板「用户」统一改叫「客户」之后，谁写的东西里再冒出
  # 「用户」就会被自动提醒改掉。
  # 怎么填：每行一条，方括号里先写旧词、再写新词；**每对都在行尾加一句
  # 方向注释「# 旧词X→统一用Y」**（方括号第一格永远是被禁的旧叫法、第二格
  # 是标准叫法——注释防止日后回看把方向读反）；如果有个更长的词
  # 恰好包含旧词字样但其实合法（容易被误伤），从第 3 个位置起列出放行。
  # 不填会怎样：这一项不检查。
  # 示例（占位示意，请换成你项目里真实的旧词新词）：
  #   - [旧词甲, 新词甲]                      # 旧词甲→统一用新词甲
  #   - [旧词乙, 新词乙, 含旧词乙字样但合法的长词]  # 旧词乙→统一用新词乙
  deprecated_aliases:
    - [客户, 用户]  # 旧词客户→统一用用户
    - [申请, 投递]  # 旧词申请→统一用投递
    - [职位, 岗位]  # 旧词职位→统一用岗位

  # （进阶，可跳过）光写「二期」「3.0 版」这类编号容易搞混——是哪条
  # 产品线的二期？这格规定：出现这类编号时，附近必须带上项目或产品线
  # 的名字做前缀。（naming_prefix_rules = 版本编号前缀规则）
  # ⚠️ 全表唯一用「一行式花括号写法」的格子，需要装 PyYAML（见文件
  # 顶部备注）才生效；没装则这格当作没填，不报错。
  # 怎么填：pattern 写要抓的编号样式（用「正则」——一种描述文字模式的
  # 写法，可以让 AI 帮你写）；valid_prefixes 列出编号附近出现哪些词算合格。
  # 示例：
  #   - {name: 里程碑编号, pattern: '\b里程碑[1-6]\b', valid_prefixes: [myshop, 路线图]}
  naming_prefix_rules:

  # 你项目里有哪些「圈内英文黑话」，出现时旁边必须带中文解释？
  # （project_terms = 项目专有英文词清单）
  # 比喻：写给全公司看的文件里冒出 order_card 这种内部词，旁边 30 个
  # 字以内必须有中文注释（比如「order_card（订单卡）」），否则自动提醒。
  # 注意：git、json 这类通用编程词别列进来，会误伤。
  # 不填会怎样：这一项不检查。
  # 示例（换成你自己项目的词）：
  #   - order_card     # 订单卡
  #   - vip_tier       # 会员等级
  project_terms:

  # 哪些文件不需要用词把关？（skip_paths = 豁免路径清单）
  # 有些文件天生要写旧词——比如词典本身（就是要列「旧叫法」）、历史
  # 归档。把它们列在这里豁免，免得被误拦。
  # 已内置豁免、不用你填：历史归档目录、代码和配置类文件。
  # 示例：
  #   - docs/GLOSSARY.md
  #   - docs/ROADMAP.md
  skip_paths:

  # AI 汇报里出现「P3」这类光秃秃的内部代号而不解释是什么时，机器会
  # 提醒它补一句人话。（codename_check = 裸代号提醒开关）
  # 这一条不用配也生效（默认开启）；觉得吵想关掉，就填 off。
  # 不填会怎样：默认开启（留空 = 开）。
  # 怎么填（示例）：codename_check: off
  codename_check:

  # （预留格子：现在填了也不生效，直接跳过即可。）
  business_keywords:
  meta_keywords:

# ────────────────────────────────────────────────────────────
# ④ 进阶区：没有下面这些设施或场景就整区跳过，别研究
# ────────────────────────────────────────────────────────────

# （进阶）你数据库里有哪些「表字段名」不该原样出现在给你看的汇报里？
# （schema_fields = 数据表字段名清单）
# 比喻：跟老板汇报要说「客户编号」，而不是甩数据库里的原始字段名
# customer_id——AI 项目总监向你汇报重大决定时若照抄字段名，会被自动提醒
# 翻译成人话。
# 不填会怎样：字段名这一项不检查（汇报里其他技术腔的检查照常有效）。
# 示例（换成你自己数据库的字段名）：
#   - customer_id    # 客户编号
#   - order_id       # 订单编号
schema_fields:

# （git = 代码存档规矩区）
git:
  # （进阶）你在多台电脑上开发、且约定「只许某一台存档代码」吗？
  # （no_git_write_host = 禁止存档代码的那台机器）
  # 场景：一台主力机 + 一台跑服务的副机，代码存档（git commit / push，
  # 即把改动写进代码仓库）只许在主力机做——副机乱存会让两边档案打架。
  # 这格填「禁止存档的那台机器」。
  # 怎么填：填 wsl（自动识别 Windows 里的 Linux 子系统）或直接填那台
  # 机器的主机名（电脑的名字，大小写不区分）。
  # 不填会怎样：不做这个限制（只有一台电脑就该留空）。
  # 临时例外：真要在那台机器存档时，命令前加 ARNOLD_GIT_WRITE_APPROVED=1
  # 显式放行这一次。
  # 示例：no_git_write_host: wsl
  no_git_write_host:

# （doc_search = 文档检索服务区）
doc_search:
  # （进阶）你有自建的「历史文档智能检索服务」吗？有就把地址填这。
  # （endpoint = 检索服务的网址）
  # 这是给已经搭了文档向量搜索（按意思找文档，不是按字面找）服务的
  # 团队用的。填了之后有两个效果：AI 用笨办法逐字翻历史文档时会被
  # 提醒改用这个服务；你提的新需求也会自动去历史记录里查是否讨论过。
  # 不填会怎样：这两个功能安静关闭（新项目没这服务很正常，跳过）。
  # 示例：endpoint: https://example.com/api/doc-search
  endpoint:

  # 没有自建服务？可以用「本地检索增强」：跟 AI 说一句「帮我装上文档
  # 检索增强」，它会照说明书一步步装好（只需装一个免费的本地 AI 引擎
  # Ollama，全在你电脑上跑、不联网不花钱），装完这格会被自动填上。
  # （mode = 检索模式；local = 用本机索引文件检索，零服务器零运维）
  # 注意：上面 endpoint 填了的话优先走 endpoint，这格就不看了。
  # 不填会怎样：跟 endpoint 一样——两格都空则检索增强安静关闭。
  # 怎么填（示例）：mode: local
  mode:

  # （进阶，可跳过）只想索引某几个文件夹？列在这。不填 = 索引全项目的
  # markdown 文档（自动跳过 .git、依赖目录、隐藏目录、超过 2MB 的文件）。
  # （index_paths = 索引范围清单）
  # 示例：
  #   index_paths:
  #     - docs
  #     - README.md
  index_paths:

  # （进阶，可跳过）在内置排除之外，想额外排除的文件夹/文件列在这。
  # （exclude = 追加排除清单）
  # 示例：
  #   exclude:
  #     - drafts
  exclude:

  # （进阶，可跳过）本机 Ollama 不在默认地址时才填。
  # （ollama_url = 本地 AI 引擎地址）
  # 不填会怎样：用默认 http://localhost:11434，一般不用动。
  ollama_url:

# （compaction = 长对话记忆压缩保护区）
compaction:
  # （进阶，默认已开，可跳过）对话太长时 AI 会自动「压缩记忆」腾地方，
  # 最容易被压丢的恰恰是「干到哪了 / 等谁拍板 / 下一步」这类在途状态。
  # 插件默认在压缩前后自动把在途任务档案的位置和要点喂回去当锚点
  # ——项目里有进行中的任务档案才动作，没有就完全安静。
  # （snapshot = 压缩快照开关）
  # 不填会怎样：默认开启（留空 = 开）。想关掉就填 off。
  snapshot:

# （worktree = 并行工作树区）
worktree:
  # （进阶，默认已开，可跳过）开「并行工作树」（worktree，同一仓库的
  # 独立工作副本，用于两摊活并行互不踩脚）时，本登记表、岗位家规这类
  # 没存进 git 的配置文件不会自动跟过去——新工作副本里自动纪律会
  # 悄悄失效还不报错。插件默认在会话启动时检测这种情况，自动从主
  # 工作副本把缺的配置带过去（只补缺，绝不覆盖已有文件）。
  # （assemble = 工作树配置装配开关）
  # 不填会怎样：默认开启（留空 = 开）。想关掉就填 off。
  assemble:

# （ci_smoke = 主流程质检备忘区）
ci_smoke:
  # （进阶）你产品最核心的「主流程」用一句话怎么描述？
  # （main_chain = 主流程描述）
  # 主流程 = 用户使用你产品最要紧的那条路。写下来是给 AI 质检员的
  # 备忘：验收时优先保证这条路没断。本区填了才生效——填了哪格，
  # 施工 / 验收成员交活前对应的自查项就启用（没填 = 对应自查项跳过）。
  # 示例：main_chain: "下单 → 支付 → 发货 → 确认收货"
  main_chain: "简历上传 → 简历分析定岗 → 各平台找岗 → 大批量一键投递 → 投递报告 → 持续跟进直到拿 offer"
  # （进阶）数据表结构升级时要同时改哪几处？（schema_upgrade_path =
  # 数据表结构升级路径备忘；防止只改一处、上线后另一处漏了出问题。）
  # 示例：schema_upgrade_path: "改建库脚本时同步改线上升级脚本"
  schema_upgrade_path:
  # （进阶）多客户共用一套系统时，靠哪个字段区分「这条数据属于谁」？
  # （isolation_field = 数据隔离字段备忘）
  # 示例：isolation_field: tenant_id
  isolation_field:
